# Your own MCP server behind nginx: streamable HTTP, so buffering off and a long read timeout.
# Replace the server_name and the certificate paths.
server {
    listen 443 ssl;
    server_name mcp.example.com;
    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # streamable-http / SSE: stream tokens, don't buffer, keep long-lived
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# optional http->https redirect
server {
    listen 80;
    server_name mcp.example.com;
    return 301 https://$host$request_uri;
}
